<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заглушка приложения</title>
  <!-- Подключаем шрифт Inter (современный, читаемый) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* Глобальный сброс и фон */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d15;
      font-family: 'Inter', sans-serif;
      padding: 1rem;
      /* Анимированный градиентный фон */
      background: linear-gradient(135deg, #0b0d15 0%, #1a1e2f 50%, #141824 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease-in-out infinite alternate;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Карточка-заглушка */
    .goodbye-card {
      position: relative;
      max-width: 700px;
      width: 100%;
      padding: 3.5rem 2.5rem;
      background: rgba(20, 25, 40, 0.65);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      /* Анимация появления карточки */
      animation: floatIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .goodbye-card:hover {
      transform: scale(1.02) translateY(-4px);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.1) inset;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Декоративные линии (просто для атмосферы) */
    .goodbye-card::before,
    .goodbye-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      z-index: -1;
      pointer-events: none;
    }

    .goodbye-card::before {
      width: 300px;
      height: 300px;
      background: #ff7b9c;
      top: -100px;
      right: -80px;
      animation: blobMove 8s ease-in-out infinite alternate;
    }

    .goodbye-card::after {
      width: 250px;
      height: 250px;
      background: #6d8cff;
      bottom: -80px;
      left: -60px;
      animation: blobMove 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 30px) scale(1.3); }
    }

    /* Основной текст — "приложение больше не поддерживается" */
    .main-message {
      position: relative;
      z-index: 2;
      font-size: clamp(1.8rem, 8vw, 3.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      /* Эффект печатной машинки (каретка) */
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid rgba(255, 215, 100, 0.6);
      width: 0;
      animation: 
        typing 2.2s steps(28, end) forwards,
        blink 0.8s step-end infinite alternate;
      animation-delay: 0.3s, 2.5s;
      /* чтобы после окончания печати курсор продолжал мигать, но оставался видимым */
    }

    /* Для переноса на мобильных (если текст не влезает) — но мы используем nowrap + clamp */
    /* дополнительно: если экран узкий, разрешим перенос и уберем nowrap */
    @media (max-width: 480px) {
      .main-message {
        white-space: normal;
        border-right: none;
        animation: none;
        width: 100%;
        text-align: center;
        border-right: 3px solid rgba(255, 215, 100, 0.6);
        animation: blink 0.8s step-end infinite alternate;
      }
      .goodbye-card {
        padding: 2.5rem 1.5rem;
      }
    }

    /* Анимация печати */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Мерцание курсора */
    @keyframes blink {
      0%, 50% { border-color: rgba(255, 215, 100, 0.6); }
      51%, 100% { border-color: transparent; }
    }

    /* Дополнительная мини-подпись (без текста, просто иконка / символ) */
    .goodbye-footer {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      font-weight: 400;
      text-transform: uppercase;
      transition: color 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .goodbye-footer:hover {
      color: rgba(255, 215, 100, 0.4);
    }

    .goodbye-footer span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: rgba(255, 215, 100, 0.3);
      border-radius: 50%;
      margin: 0 4px;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    .goodbye-footer span:nth-child(2) { animation-delay: 0.3s; }
    .goodbye-footer span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); background: rgba(255, 215, 100, 0.8); }
    }

    /* Небольшая "кнопка" — без текста, просто для атмосферы */
    .ghost-button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(4px);
      transition: all 0.25s ease;
      cursor: default;
      position: relative;
      z-index: 2;
    }

    .ghost-button:hover {
      background: rgba(255, 215, 100, 0.06);
      border-color: rgba(255, 215, 100, 0.2);
      box-shadow: 0 0 30px rgba(255, 215, 100, 0.05);
    }

    .ghost-button .icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 215, 100, 0.2);
      margin: 0 6px;
      transition: 0.3s;
    }

    .ghost-button:hover .icon {
      background: rgba(255, 215, 100, 0.6);
      box-shadow: 0 0 20px rgba(255, 215, 100, 0.3);
    }

    /* Адаптивность: на очень маленьких экранах делаем отступы меньше */
    @media (max-width: 380px) {
      .goodbye-card {
        padding: 1.8rem 1rem;
        border-radius: 2rem;
      }
      .main-message {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="goodbye-card">
    <!-- Основной текст: ровно то, что просили, но с анимацией -->
    <div class="main-message">приложение больше не поддерживается</div>

    <!-- Абсолютно декоративные элементы, никакого лишнего текста -->
    <div class="goodbye-footer">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Просто визуальная "кнопка" без текста, чтобы завершить композицию -->
    <div class="ghost-button">
      <span class="icon"></span>
      <span class="icon"></span>
      <span class="icon"></span>
    </div>
  </div>
</body>
</html>
